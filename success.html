<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Success</title>
<style>
body{
  margin:0;
  height:100vh;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00ffd5;
  font-family:Arial;
}
.box{
  text-align:center;
  animation:pulse 1.5s infinite;
}
@keyframes pulse{
  0%{transform:scale(1);opacity:.6;}
  50%{transform:scale(1.1);opacity:1;}
  100%{transform:scale(1);opacity:.6;}
}
</style>
</head>
<body>
<div class="box">
  <h1>NO LOSS SETTING</h1>
  <h2>ON SUCCESSFUL ✅</h2>
</div>
</body>
</html>
