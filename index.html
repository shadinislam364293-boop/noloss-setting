<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO LOSS SETTING</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
  height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  width:90%;
  max-width:380px;
  background:rgba(255,255,255,0.08);
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,.4);
}
h1{color:#00ffd5;letter-spacing:2px;margin-bottom:20px;}
.logo{width:65px;animation:glow 2s infinite;}
@keyframes glow{
  0%{transform:scale(1);filter:drop-shadow(0 0 5px #00ffd5);}
  50%{transform:scale(1.25);filter:drop-shadow(0 0 20px #00ffd5);}
  100%{transform:scale(1);filter:drop-shadow(0 0 5px #00ffd5);}
}
.subtitle{color:#fff;margin:15px 0;font-weight:bold;}
input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-bottom:15px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:#00ffd5;
  color:#000;
  font-size:18px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <h1>NO LOSS SETTING</h1>

  <img src="quotex.png.PNG" class="logo">

  <div class="subtitle">ID LOGIN</div>

  <input type="text" id="uid" placeholder="Enter UID">
  <input type="password" id="pass" placeholder="Enter Password">

  <button onclick="login()">Login</button>
</div>

<script>
function login(){
  const pass = document.getElementById("pass").value;

  if(pass === "riskey09"){
    window.location.href = "success.html";
  }else{
    alert("Wrong Password ❌");
  }
}
</script>

</body>
</html>
