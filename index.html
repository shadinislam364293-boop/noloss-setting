<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Loss Setting - Login</title>

<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
}
.card{
  width:90%;
  max-width:360px;
  background:rgba(255,255,255,0.08);
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
  backdrop-filter:blur(10px);
}
.logo img{
  width:90px;
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{filter:drop-shadow(0 0 5px #00ffd5)}
  to{filter:drop-shadow(0 0 20px #00ffd5)}
}
h1{
  color:#00ffd5;
  letter-spacing:2px;
  margin:20px 0;
}
input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin:10px 0;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:none;
  border-radius:30px;
  background:#00ffd5;
  color:#000;
  font-size:18px;
  font-weight:bold;
}
.error{
  color:#ff6b6b;
  margin-top:10px;
}
.telegram a{
  display:inline-block;
  margin-top:15px;
  color:#00ffd5;
  text-decoration:none;
  animation:glow 2s infinite alternate;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">
    <img src="quotex.png.PNG" alt="logo">
  </div>

  <h1>NO LOSS SETTING</h1>

  <input id="uid" type="text" placeholder="Enter UID">
  <input id="pass" type="password" placeholder="Enter Password">

  <button onclick="login()">Login</button>

  <div class="error" id="error"></div>

  <div class="telegram">
    <a href="https://t.me/riskey09" target="_blank">
      ✈️ Contact by Telegram : @riskey09
    </a>
  </div>
</div>

<script>
/* 🔐 Only PASSWORD check */
const FIXED_PASS = "riskey09";

/* auto login if already logged */
if(localStorage.getItem("loggedIn")==="true"){
  window.location.href="success.html";
}

function login(){
  const pass = document.getElementById("pass").value;
  const error = document.getElementById("error");

  if(pass === FIXED_PASS){
    localStorage.setItem("loggedIn","true");
    window.location.href="success.html";
  }else{
    error.innerText = "❌ Wrong Password";
  }
}
</script>

</body>
</html>
