<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Loss Setting - Login</title>

<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
}
.card{
  width:90%;
  max-width:360px;
  background:rgba(255,255,255,0.08);
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
  backdrop-filter:blur(10px);
}
.logo{
  width:90px;
  height:90px;
  margin:0 auto 15px;
}
.logo img{
  width:100%;
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{filter:drop-shadow(0 0 5px #00ffd5)}
  to{filter:drop-shadow(0 0 20px #00ffd5)}
}
h1{
  color:#00ffd5;
  letter-spacing:2px;
  margin-bottom:20px;
}
input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin:10px 0;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:none;
  border-radius:30px;
  background:#00ffd5;
  color:#000;
  font-size:18px;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="card">
  <div class="logo">
    <img src="quotex.png.PNG" alt="Quotex">
  </div>

  <h1>NO LOSS SETTING</h1>

  <input type="text" placeholder="Enter UID">
  <input type="password" placeholder="Enter Password">

  <button id="loginBtn" onclick="doLogin()">Login</button>
</div>

<script>
function doLogin(){
  const btn=document.getElementById("loginBtn");
  btn.innerText="Checking...";
  btn.disabled=true;

  setTimeout(()=>{
    window.location.href="success.html";
  },1500);
}
</script>
</body>
</html>
