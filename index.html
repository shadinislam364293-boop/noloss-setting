<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO LOSS SETTING</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body{
  height:100vh;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:90%;
  max-width:380px;
  background: rgba(255,255,255,0.08);
  border-radius:20px;
  padding:30px 20px;
  box-shadow:0 25px 60px rgba(0,0,0,0.4);
  text-align:center;
}

h1{
  color:#00ffd5;
  letter-spacing:2px;
  margin-bottom:20px;
}

/* LOGO */
.logo-box{
  width:90px;
  height:90px;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  width:65px;
  height:65px;
  animation: glow 2s infinite ease-in-out;
}

/* Glow animation */
@keyframes glow{
  0%{
    transform:scale(1);
    filter: drop-shadow(0 0 6px #00ffd5);
    opacity:.7;
  }
  50%{
    transform:scale(1.25);
    filter: drop-shadow(0 0 20px #00ffd5);
    opacity:1;
  }
  100%{
    transform:scale(1);
    filter: drop-shadow(0 0 6px #00ffd5);
    opacity:.7;
  }
}

.subtitle{
  color:#fff;
  margin-bottom:18px;
  font-weight:bold;
  letter-spacing:1px;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  margin-bottom:15px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:#00ffd5;
  color:#000;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.95);
}
</style>
</head>

<body>

<div class="card">
  <h1>NO LOSS SETTING</h1>

  <!-- QUOTEX LOGO -->
  <div class="logo-box">
    <img src="quotex.png.PNG" class="logo" alt="Quotex Logo">
  </div>

  <div class="subtitle">ID LOGIN</div>

  <input type="text" placeholder="Enter UID">
  <input type="password" placeholder="Enter Password">

  <button>Login</button>
</div>

</body>
</html>
